name: impact_analyzer_workspace
description: Monorepo workspace for Impact Analyzer (Dart/Flutter change impact analysis).
publish_to: none
version: 0.1.0

repository: https://github.com/RajKavadia/impact-analyzer
issue_tracker: https://github.com/RajKavadia/impact-analyzer/issues

environment:
  sdk: ^3.13.0

workspace:
  - packages/impact_analyzer
  - packages/impact_analyzer_cli
  - packages/impact_analyzer_mcp
  - packages/impact_analyzer_dashboard

dev_dependencies:
  lints: ^6.1.0
